name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev/initial-version

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_region: ap-southeast-1
      TF_VAR_github_repo: $GITHUB_REPOSITORY
      TF_VAR_s3_bucket_name: dirty-binaries
      TF_VAR_webhook_url: "https://your-webhook-endpoint.com"
      TF_VAR_oidc_provider_arn: "arn:aws:iam::345594603974:oidc-provider/token.actions.githubusercontent.com"
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::345594603974:role/TerraformCICDPolicy
          role-session-name: GitHubActions
          aws-region: ap-southeast-1

      - name: Download dependencies and package lambda function
        working-directory: lambda_handler
        run: |
          mkdir -p site_packages
          python3.12 -m pip install requests -t site_packages/
          zip -r9 ../terraform/lambda.zip .

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply (on push to main)
        working-directory: terraform
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev/initial-version

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::345594603974:role/GitHubOIDCRole
          role-session-name: GitHubActions
          aws-region: ap-southeast-1
      
      - name: Download dependencies and package lambda function
        run: |
          pushd lambda_handler
          python3.12 -m pip install requests -t .
          zip -r9 lambda.zip .
          popd

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply (on push to main)
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan